# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: difit-go

before:
  hooks:
    # The web UI is embedded into the binary, so build it once up front.
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build
    - go mod tidy -diff

builds:
  - id: difit
    main: ./cmd/difit
    binary: difit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: difit
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "difit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
